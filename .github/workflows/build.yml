name: Build and Release MineDash

# Triggered by pushing a version tag, e.g. `git tag v1.0.1 && git push --tags`.
# Pushing to main does NOT release — so commits stay cheap and only deliberate
# tagged releases burn CI minutes and notify users.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The tag (e.g. `v1.0.1`) is the source of truth for the release version.
      # We sync package.json to it before electron-builder reads the version,
      # so the user only needs to maintain the tag — no need to remember to
      # also bump package.json in the commit. If the tag doesn't look like a
      # semver, we bail loudly so a typo doesn't ship as "vfoo".
      - name: Derive version from tag and patch package.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            Write-Error "Tag '$tag' does not look like a semver tag (vX.Y.Z). Aborting."
            exit 1
          }
          $version = $tag.TrimStart('v')
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          Write-Output "Set package.json version to $version"

      - name: Install root dependencies (electron, electron-builder)
        run: npm install

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      # electron-builder runs build:frontend internally via the release script
      # and then publishes to the minedash-releases public repo. GH_TOKEN must
      # have `contents: write` on minedash-releases — the default GITHUB_TOKEN
      # only authorizes the current repo, so we use a fine-grained PAT stored
      # as the RELEASES_TOKEN secret.
      - name: Build and publish Electron installer
        run: npm run build:release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      # Pull the section for this version out of CHANGELOG.md and stash it as
      # release-notes.md. If the section is missing (e.g. someone tagged a
      # version they forgot to write notes for) we fall back to a placeholder
      # so the release still publishes — just without curated notes.
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if (-not (Test-Path CHANGELOG.md)) {
            Write-Output "No CHANGELOG.md present; using placeholder notes."
            "Release $tag" | Out-File release-notes.md -Encoding utf8
            exit 0
          }
          $content = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          # Match: `## vX.Y.Z …` up to the next `## v` heading or end of file.
          # (?ms) = multiline + dotall; \Z = end of string.
          $pattern = "(?ms)^## v$escaped\b[^\n]*\n(.*?)(?=^## v|\Z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim() -replace "^\s*---\s*$", ""
            $body = $body.Trim()
            if (-not $body) { $body = "Release $tag" }
          } else {
            Write-Output "No CHANGELOG.md section found for $tag; using placeholder."
            $body = "Release $tag"
          }
          $body | Out-File release-notes.md -Encoding utf8
          Write-Output "----- release-notes.md -----"
          Write-Output $body

      # electron-builder creates the release as a draft. electron-updater
      # ignores drafts, so we flip it to published here AND attach the
      # CHANGELOG-extracted notes as the release body. Doing both inline in CI
      # is the difference between "tag-and-forget" and "tag, wait, log in to
      # GitHub, click a button" — the whole point of this workflow.
      - name: Publish draft release with notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release edit $tag --repo proffesionalprogrammer/minedash-releases --draft=false --notes-file release-notes.md
