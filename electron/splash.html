<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>MineDash</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<script>
  // Same theme the app will open in (App.jsx mirrors it into localStorage, which
  // file:// pages share), so a Light user isn't flashed a dark splash.
  try {
    const pref = localStorage.getItem('minedash-theme') || 'dark';
    const sysLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme',
      pref === 'system' ? (sysLight ? 'light' : 'dark') : pref);
  } catch { /* fall back to dark */ }
</script>
<style>
  :root, :root[data-theme="dark"] {
    --c-surface-1: #1A1A1A; --c-border: #2D2D2D;
    --c-text-primary: #FFFFFF; --c-text-secondary: #A0A0A0;
  }
  :root[data-theme="light"] {
    --c-surface-1: #F4F4F5; --c-border: #DDDDDD;
    --c-text-primary: #111827; --c-text-secondary: #4B5563;
  }
  :root[data-theme="oled"] {
    --c-surface-1: #0A0A0A; --c-border: #262626;
    --c-text-primary: #FFFFFF; --c-text-secondary: #A0A0A0;
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-app-region: drag;
  }
  .card {
    box-sizing: border-box; width: 324px; height: 204px;
    background: var(--c-surface-1); border: 1px solid var(--c-border);
    border-radius: 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  .block { width: 56px; height: 56px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .name { color: var(--c-text-primary); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .bar {
    position: relative; width: 160px; height: 4px; border-radius: 4px;
    background: var(--c-border); overflow: hidden;
  }
  .bar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px;
    background: #00AF5C; animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
  .status {
    color: var(--c-text-secondary); font-weight: 700; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  @media (prefers-reduced-motion: reduce) { .block { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <!-- Same pixel grass block as TitleBar.jsx -->
    <svg class="block" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="0" y="0" width="8" height="3" fill="#5EA91E" />
      <rect x="1" y="0" width="1" height="1" fill="#7DB356" />
      <rect x="4" y="0" width="1" height="1" fill="#7DB356" />
      <rect x="6" y="1" width="1" height="1" fill="#7DB356" />
      <rect x="2" y="1" width="1" height="1" fill="#4CAF50" />
      <rect x="0" y="3" width="8" height="5" fill="#96583E" />
      <rect x="1" y="4" width="1" height="1" fill="#C8A882" />
      <rect x="4" y="5" width="1" height="1" fill="#7A4E32" />
      <rect x="6" y="4" width="1" height="1" fill="#7A4E32" />
      <rect x="2" y="6" width="1" height="1" fill="#C8A882" />
      <rect x="5" y="6" width="1" height="1" fill="#8E8E8E" />
    </svg>
    <div class="name">MineDash</div>
    <div class="bar"></div>
    <div class="status">Starting</div>
  </div>
</body>
</html>
